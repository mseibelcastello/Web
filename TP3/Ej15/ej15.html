<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Persona</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<div class="contenedor">
    <h2>Contacto</h2>

    <div class="info-contacto">
        <p><strong>Nombre:</strong> María Elena Torres</p>
        <p><strong>Email:</strong> <a href="mailto:maria.torres@example.com">maria.torres@example.com</a></p>
        <p><strong>Teléfono:</strong> <a href="tel:+1234567890">123-456-7890</a></p>
        <p><strong>Dirección:</strong> 500 Terry Francois Street, San Francisco, CA 94158</p>
    </div>

    <h3>Formulario de consulta</h3>

    <form action="ej15_ok.html" method="get">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Ingresá tu nombre">

        <label>Email</label>
        <input type="email" name="email" placeholder="Ingresá tu email">

        <label>Asunto</label>
        <input type="text" name="asunto" placeholder="Motivo de tu consulta">

        <label>Mensaje</label>
        <textarea name="mensaje" rows="5" placeholder="Escribí tu mensaje"></textarea>

        <button type="submit">Enviar</button>
    </form>
</div>

</body>
</html>
