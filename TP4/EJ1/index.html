<!DOCTYPE html>
<html lang= "es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel = "stylesheet">
    <link rel="stylesheet" href="1estilo.css">
    </head>

    <body class="py-5 d-flex flex-column align-items-center">
        <div class="container" style="max-width: 650px;">            


                <!--Titulo-->
                <div class = "text-center mb-4">
                    <h1 class ="titulo-principal display-5">Adivina el número</h1>
                    <p class="text-light-50 fs-6">
                        Encuentra el número secreto entre <strong>1 y 1000</strong></p>
                </div> 

                <!-- Panel de Estadísticas -->
                <div class="row text-center mb-4 g-2">
                <div class="col-6 col-md-3"> 
                    <div class="stat-card"> 
                        <small  class="text-uppercase text-secondary fw-bold" style="font-size: 0.75rem;">Intentos</small> 
                        <h3 id="stat-intentos" class="mb-0 text-info fw-bold">0</h3>
                    </div>
                </div>
            <div class="col-6 col-md-3">
            <div class="stat-card"> 
                        <small  class="text-uppercase text-secondary fw-bold" style="font-size: 0.75rem;">Mejor Record</small> 
                        <h3 id="stat-mejor" class="mb-0 text-success fw-bold">-</h3>
                    </div>
            </div>
            <div class="col-6 col-md-3">
            <div class="stat-card"> 
                        <small  class="text-uppercase text-secondary fw-bold" style="font-size: 0.75rem;">Partidas</small> 
                        <h3 id="stat-partidas" class="mb-0 text-warning fw-bold">0</h3>
                    </div>
            </div>

            <div class="col-6 col-md-3">
           <div class="stat-card"> 
                        <small  class="text-uppercase text-secondary fw-bold" style="font-size: 0.75rem;">Promedio</small> 
                        <h3 id="stat-promedio" class="mb-0 text-danger fw-bold">0.0</h3>
                    </div>
                    </div>
            </div>

            <!--zona juego-->
            <div class="card card-juego p-4">
                
                <form id="form-juego" onsubmit="procesarIntento(event)" class = "mb-3"> 
                    <label for="input-numero" class="form-label text-center d-block mb-2 text-light">
                        Ingresa un número entero entre 1 y 1000:
                    </label>
                    <div class="input-group input-group-lg">
                        
                        <input type="number" id="input-numero" class="form-control text-center fs-4 fw-bold"
                        min="1" max="1000" placeholder="Ej: 500" required autofocus>
                        <button type="submit" class="btn btn-info text-white fw-bold px-4">
                            Arriesgar </button>
                        </div>
                </form>

                <!--mensaje-->
               <div id="mensaje-pista" class="alert alert-dark text-center fs-5 mb-3 border-secondary" role="alert">
                    ¡Ingresá tu primero número para comenzar!
                </div>

                <!--Boton que reinicia-->
                <div class="d-grid">       
                    <button type="button" class="btn btn-outline-danger" onclick="reiniciarPartida()">
                        Reiniciar Partida Actual
                    </button>      
                </div>
            </div>
        </div>       


    <script src="script.js"></script>

    <footer class="page-footer mt-5">
        <div class="footer-copyright">
            <div class="container">Trabajo Practico 4 - Ejercicio 1 - PERALTA Damaris, SEIBEL Micaela</div>
        </div>
    </footer>
</body>
</html>
